.glass {
  background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.045) 52%, rgba(168,85,247,.08));
  border: 1px solid rgba(255,255,255,.20);
  box-shadow: 0 28px 80px rgba(0,0,0,.48), 0 0 0 1px rgba(34,230,255,.08), inset 0 1px 0 rgba(255,255,255,.18);
  backdrop-filter: blur(22px);
}

.field {
  width: 100%;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(3,8,24,.58);
  color: white;
  border-radius: 14px;
  padding: 13px 14px;
  outline: none;
  transition: .2s ease;
}

.field::-moz-placeholder {
  color: #8191b1;
}

.field::placeholder {
  color: #8191b1;
}

.field:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 4px rgba(34,230,255,.16);
}

.gradient-btn {
  background: linear-gradient(90deg, #06c8ef, #8b5cf6 58%, #d946ef);
  box-shadow: 0 12px 32px rgba(139,92,246,.42), 0 0 24px rgba(34,230,255,.18);
  transition: transform .18s ease, filter .18s ease;
}

.gradient-btn:hover {
  filter: brightness(1.12);
  transform: translateY(-1px);
}

.gradient-btn:active {
  transform: translateY(1px) scale(.99);
}

.orb {
  position: absolute;
  border-radius: 9999px;
  filter: blur(70px);
  opacity: .62;
  pointer-events: none;
}

@keyframes floaty {
  0%,100% {
    transform: translateY(0) scale(1);
  }

  50% {
    transform: translateY(-14px) scale(1.05);
  }
}

@keyframes pop {
  0% {
    transform: scale(.6);
    opacity: 0;
  }

  70% {
    transform: scale(1.08);
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes spinRing {
  to {
    transform: rotate(360deg);
  }
}

.floaty {
  animation: floaty 6s ease-in-out infinite;
}

.pop {
  animation: pop .45s ease both;
}

.spin-ring {
  animation: spinRing 1s linear infinite;
}

@keyframes shimmer {
  0% {
    background-position: -200% 0;
  }

  100% {
    background-position: 200% 0;
  }
}

.shimmer {
  background-size: 200% 100%;
  animation: shimmer 2.2s linear infinite;
}

.hover\:bg-white\/10:hover{
  background-color: rgb(255 255 255 / 0.1);
}

.hover\:bg-white\/\[\.12\]:hover{
  background-color: rgb(255 255 255 / .12);
}

.hover\:text-cyan-200:hover{
  --tw-text-opacity: 1;
  color: rgb(165 243 252 / var(--tw-text-opacity, 1));
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.hover\:underline:hover{
  text-decoration-line: underline;
}

.disabled\:cursor-wait:disabled{
  cursor: wait;
}

.disabled\:opacity-80:disabled{
  opacity: 0.8;
}

@media (min-width: 640px){
  .sm\:flex{
    display: flex;
  }

  .sm\:h-96{
    height: 24rem;
  }

  .sm\:h-\[26rem\]{
    height: 26rem;
  }

  .sm\:w-96{
    width: 24rem;
  }

  .sm\:w-\[26rem\]{
    width: 26rem;
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .sm\:py-9{
    padding-top: 2.25rem;
    padding-bottom: 2.25rem;
  }

  .sm\:pb-7{
    padding-bottom: 1.75rem;
  }

  .sm\:pt-10{
    padding-top: 2.5rem;
  }

  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}

@media (min-width: 1024px){
  .lg\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }
}
